kind = "web"
previewPath = "/"
title = "My Jersey"
description = "My Jersey’s repository-matched sportswear website, with custom jersey requests, WhatsApp ordering and a one-shot realistic street-football hero video."
version = "1.0.0"
id = "artifacts/my-jersey"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23805

[services.development]
run = "pnpm --filter @workspace/my-jersey run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-jersey", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-jersey/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23805"
BASE_PATH = "/"
