<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f7f9fe" id="tc" /><meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>My Jersey – Crafted for Champions</title>
    <script>(function(){var t;try{t=localStorage.getItem('mj-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}var r=document.documentElement;r.dataset.theme=t;if(t==='dark')r.classList.add('dark');var m=document.getElementById('tc');if(m)m.setAttribute('content',t==='dark'?'#060912':'#f7f9fe')})();</script>
    <meta name="description" content="My Jersey – custom football and cricket jerseys made in Bangladesh. Design your own with your colors, name and number. Outlet in Chapai Nawabganj, factory in Mirpur DOHS, Dhaka." />

    <meta property="og:type" content="website" /><meta property="og:title" content="My Jersey – Crafted for Champions" /><meta property="og:description" content="Design premium custom jerseys for your team, club or community." /><meta property="og:image" content="/api/hero-media/poster.jpg" /><meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
